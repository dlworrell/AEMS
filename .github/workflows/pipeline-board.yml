name: Pipeline Board

# Catylist ADR-0013: rebuilds the pinned "Pipeline board" issue in AEMS with
# the stage of every adopted repository (topic -> dev-daily -> fitment -> main
# -> release) and the pull requests that carried each recent change. Read-only
# toward every repository; it only edits that one issue.
# See docs/engineering/pipeline-board.md.

on:
  schedule:
    - cron: '20,50 * * * *'  # after each fitment cycle (:15 and :45)
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the board in the job log instead of updating the issue.
        required: false
        default: false
        type: boolean

# issues: write reaches only the AEMS board issue. Other repositories are read
# with a read-only catylist-ring-0 App token.
permissions:
  contents: read
  issues: write

concurrency:
  group: pipeline-board
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  board:
    name: Pipeline board
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ring-0

    steps:
      - name: Check out AEMS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Test the board
        run: python3 -m unittest tests.test_pipeline_board -v

      - name: Create read-only catylist-ring-0 installation token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '5474337'
          private-key: ${{ secrets.RING0_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-pull-requests: read

      - name: Build and publish the board
        env:
          RING0_APP_TOKEN: ${{ steps.app.outputs.token }}
          BOARD_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN:-false}" = "true" ]; then
            python3 scripts/pipeline_board.py --dry-run | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/pipeline_board.py
          fi
