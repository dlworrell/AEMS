name: AES-SEC-001 Distributed Governance

on:
  workflow_call:
    inputs:
      include_dangerous_primitives:
        description: Report review-required primitives as warnings.
        required: false
        default: true
        type: boolean
      strict:
        description: Enforce the current AES-SEC-001 minimum adoption gate.
        required: false
        default: true
        type: boolean
      strict_review_ratchet:
        description: Enforce repository-local review dispositions after baseline migration.
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      include_dangerous_primitives:
        description: Report review-required primitives as warnings.
        required: false
        default: true
        type: boolean
      strict:
        description: Enforce the current AES-SEC-001 minimum adoption gate.
        required: false
        default: true
        type: boolean
      strict_review_ratchet:
        description: Enforce repository-local review dispositions after baseline migration.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out governed repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Clang-Tidy
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-tidy

      - name: Validate repository Clang-Tidy policy
        run: |
          test -f .clang-tidy
          clang-tidy --verify-config --config-file=.clang-tidy

      - name: Run distributed AES-SEC-001 governance scan
        uses: dlworrell/AEMS/.github/actions/aes-sec-001@main
        with:
          include-dangerous-primitives: ${{ inputs.include_dangerous_primitives }}
          strict: ${{ inputs.strict }}
          strict-review-ratchet: ${{ inputs.strict_review_ratchet }}

      - name: Upload governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aes-sec-001-governance-${{ github.run_id }}
          path: build/aems/aes-sec-001/
          if-no-files-found: error
          retention-days: 30
