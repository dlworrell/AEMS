name: Publish reviewed AEMS issue 60 documentation fix
on:
  push:
    branches: [bootstrap/aems-60-pending-sandbox-20261026]
permissions:
  contents: write
concurrency:
  group: publish-aems-60-pending-sandbox-20261026
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'dlworrell/AEMS' && github.actor == 'dlworrell'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact daily base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0de201c94373bf32ad51ef895e4450cf7345ed00
          path: work
          persist-credentials: false
      - name: Check out the pinned canonical signed publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dlworrell/repo_templates
          ref: 3f26587d7f3f84df0c2a510cd2d1cae4c2d25af7
          path: publisher
          persist-credentials: false
      - name: Prepare exact reviewed content and verify unchanged behavior
        env:
          EXPECTED_PAYLOAD_SHA256: e53a56a5893dfc0f370064300b837bfe44e65b4d8adacfe9c5911397ef1bb155
        run: |
          python3 - <<'PY'
          import ast, base64, hashlib, json, os, pathlib, subprocess
          raw = base64.b64decode('', validate=True)
          assert hashlib.sha256(raw).hexdigest() == os.environ['EXPECTED_PAYLOAD_SHA256']
          p = json.loads(raw)
          assert p['repository'] == 'dlworrell/AEMS'
          assert p['base_branch'] == 'dev-daily' and p['base_sha'] == '0de201c94373bf32ad51ef895e4450cf7345ed00'
          assert p['branch'] == 'fix/60-pending-sandbox-authority'
          allowed = {'config/ring0.json', 'docs/engineering/catylist-default-branch-rulesets.md', 'scripts/catylist_rulesets.py'}
          assert set(p['paths']) == allowed and {f['path'] for f in p['files']} == allowed
          assert len(p['files']) == len(allowed)
          root = pathlib.Path('work').resolve()
          assert subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip() == p['base_sha']
          for item in p['files']:
              target = root / item['path']
              old = target.read_bytes()
              blob = lambda b: hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()
              assert blob(old) == item['old_blob_sha']
              new = base64.b64decode(item['base64'], validate=True)
              assert blob(new) == item['blob_sha']
              if item['path'] == 'scripts/catylist_rulesets.py':
                  assert ast.dump(ast.parse(old), include_attributes=False) == ast.dump(ast.parse(new), include_attributes=False)
              if item['path'] == 'config/ring0.json':
                  before, after = json.loads(old), json.loads(new)
                  after['description'] = before['description']
                  assert before == after
              target.write_bytes(new)
          subprocess.run(['git', '-C', str(root), 'add', '--', *p['paths']], check=True)
          assert subprocess.check_output(['git', '-C', str(root), 'write-tree'], text=True).strip() == p['tree_sha']
          subprocess.run(['git', '-C', str(root), 'diff', '--cached', '--check'], check=True)
          pathlib.Path('reviewed-payload.json').write_bytes(raw)
          PY
      - name: Validate the ruleset implementation
        working-directory: work
        run: python3 -m unittest tests.test_catylist_rulesets -q
      - name: Publish and verify the exact signed fix commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_PAYLOAD_SHA256: e53a56a5893dfc0f370064300b837bfe44e65b4d8adacfe9c5911397ef1bb155
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, sys
          raw = pathlib.Path('reviewed-payload.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == os.environ['EXPECTED_PAYLOAD_SHA256']
          p = json.loads(raw)
          spec = importlib.util.spec_from_file_location('canonical_publisher', 'publisher/tools/project_zero_commit.py')
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          assert module.main(['--repository', p['repository'], '--branch', p['branch'], '--base', p['base_branch'], '--root', 'work', '--message', p['message'], *p['paths']]) == 0
          api = module.GitHub(os.environ['GITHUB_TOKEN'], 'https://api.github.com', 'https://api.github.com/graphql')
          sha = api.ref_sha(p['repository'], p['branch'])
          status, commit = api.rest('GET', f"/repos/{p['repository']}/commits/{sha}")
          assert status == 200 and commit['commit']['tree']['sha'] == p['tree_sha']
          assert [parent['sha'] for parent in commit['parents']] == [p['base_sha']]
          assert commit['commit']['verification']['verified'] is True and commit['commit']['verification']['reason'] == 'valid'
          print('Verified issue #60 publication:', sha, 'tree', p['tree_sha'])
          PY
