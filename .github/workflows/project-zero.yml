name: Project Zero Evidence

on:
  pull_request:
    paths:
      - "aems/**"
      - "aes-manifest.yaml"
      - "docs/architecture/artifact-and-traceability-model.md"
      - "docs/engineering/reports/AEMS-P0-*.md"
      - "examples/traceability/**"
      - "schemas/aems-traceability-v1.schema.json"
      - "scripts/aems_*.py"
      - "scripts/catylist_rulesets.py"
      - "scripts/cleanup_merged_branches.py"
      - "scripts/coordination_integrity.py"
      - "scripts/validate_traceability.py"
      - "tests/test_inventory.py"
      - "tests/test_issue_graph.py"
      - "tests/test_project_zero.py"
      - "tests/test_structured.py"
      - "tests/test_traceability.py"
      - "tests/test_catylist_rulesets.py"
      - "tests/test_cleanup_merged_branches.py"
      - "tests/test_coordination_integrity.py"
      - ".github/workflows/project-zero.yml"
  push:
    branches:
      - main
      # Catylist ADR-0013: the fitment gate reads this result on each branch head.
      - dev-daily
      - fitment
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  evidence:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out AEMS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out Atarix integration fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dlworrell/atarix
          path: integration/atarix

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Run deterministic unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate traceability example
        run: |
          mkdir -p build/aems/project-zero
          python3 scripts/validate_traceability.py \
            examples/traceability/project-zero-engine.json \
            > build/aems/project-zero/traceability.md

      - name: Generate AEMS Project Zero evidence
        run: |
          python3 scripts/aems_project_zero.py . \
            --output build/aems/project-zero
          python3 -c 'import json; data=json.load(open("build/aems/project-zero/assessment.json", encoding="utf-8")); assert data["current_state"] == "CERTIFICATION"; assert data["declared_state"] == "CERTIFICATION"'

      - name: Generate Atarix inventory integration evidence
        run: |
          python3 scripts/aems_repository_inventory.py integration/atarix \
            --repository dlworrell/atarix \
            --format json \
            --output build/aems/project-zero/atarix-inventory.json
          python3 scripts/aems_repository_inventory.py integration/atarix \
            --repository dlworrell/atarix \
            --format markdown \
            --output build/aems/project-zero/atarix-inventory.md

      - name: Add assessment to job summary
        run: cat build/aems/project-zero/assessment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-zero-${{ github.run_id }}
          path: build/aems/project-zero/
          if-no-files-found: error
          retention-days: 30
