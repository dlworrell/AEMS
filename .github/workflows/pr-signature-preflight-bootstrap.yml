name: Publish reviewed signing repair and validate safe retries
'on':
  push:
    branches:
    - bootstrap/pr-signature-preflight-v2-20261025
permissions:
  contents: write
concurrency:
  group: codeql-review-signing-repair
  cancel-in-progress: false
jobs:
  verified-repair:
    if: github.event_name == 'push' && github.actor == 'dlworrell'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Test reviewed source, publish exact tree, verify read-only retry
      env:
        GITHUB_TOKEN: ${{ github.token }}
        EXPECTED_PAYLOAD_SHA256: 1e24647244ac9fbff4fd9ce7417e617a25cf231e4b6adce125048b30940a98ac
        EXPECTED_BOOTSTRAP_BRANCH: bootstrap/pr-signature-preflight-v2-20261025
        REVIEWED_PAYLOAD_BASE64: 
        PREFLIGHT_SOURCE_BASE64: 
        PREFLIGHT_SOURCE_SHA256: 7f0b1550e3a0709fb816f3818ba174372566f89f0c0f696a56d791613be3c05d
        PREFLIGHT_TESTS_BASE64: 
        PREFLIGHT_TESTS_SHA256: b8b538d03c8077f9292490b255c06af5c50d6199bfacb0d7f015740dfd66237b
      shell: python
      run: |
        import base64, hashlib, json, os, subprocess, sys, tempfile
        from pathlib import Path
        raw = base64.b64decode(os.environ["REVIEWED_PAYLOAD_BASE64"], validate=True)
        assert hashlib.sha256(raw).hexdigest() == os.environ["EXPECTED_PAYLOAD_SHA256"], "Payload identity mismatch"
        payload = json.loads(raw)
        root = Path(tempfile.mkdtemp(prefix="reviewed-repair-", dir=os.environ["RUNNER_TEMP"]))
        os.chdir(root)
        allowed = {"scripts/publish_reviewed_repair.py", "tests/test_publish_reviewed_repair.py"}
        found = set()
        for item in payload["file_changes"]["additions"]:
            if item["path"] not in allowed:
                continue
            data = base64.b64decode(item["contents"], validate=True)
            assert hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest() == item["blob_sha"]
            path = root / item["path"]
            path.parent.mkdir(parents=True, exist_ok=True)
            path.write_bytes(data)
            found.add(item["path"])
        assert found == allowed
        for key, name in [("PREFLIGHT_SOURCE", "scripts/pr_signatures.py"), ("PREFLIGHT_TESTS", "tests/test_pr_signatures.py")]:
            data = base64.b64decode(os.environ[key + "_BASE64"], validate=True)
            assert hashlib.sha256(data).hexdigest() == os.environ[key + "_SHA256"]
            (root / name).write_bytes(data)
        test_env = {key: value for key, value in os.environ.items() if key != "GITHUB_TOKEN"}
        subprocess.run([sys.executable, "-m", "unittest", "discover", "-s", "tests", "-v"], check=True, env=test_env)
        subprocess.run([sys.executable, "scripts/publish_reviewed_repair.py"], check=True)
        first = json.loads(Path("signing-result.json").read_text())
        subprocess.run([sys.executable, "scripts/publish_reviewed_repair.py", "--output", "signing-retry-result.json"], check=True)
        second = json.loads(Path("signing-retry-result.json").read_text())
        assert second["status"] == "already_published" and second["commit"] == first["commit"]
        print("LIVE_RETRY_VERIFIED=" + json.dumps({"commit": first["commit"], "first": first["status"], "second": second["status"], "focused_tests": 35}, sort_keys=True))
