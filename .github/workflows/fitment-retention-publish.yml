name: Publish reviewed fitment retention repair
on:
  push:
    branches: [bootstrap/aems-fitment-retention-20261026]
permissions:
  contents: write
concurrency:
  group: publish-fitment-retention-20261026
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'dlworrell/AEMS' && github.actor == 'dlworrell'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed daily base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 89b443eabc325cac9d9fc54809ec8a1ef9b359ec
          path: work
          persist-credentials: false
      - name: Check out the reviewed canonical signed publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dlworrell/repo_templates
          ref: 3f26587d7f3f84df0c2a510cd2d1cae4c2d25af7
          path: publisher
          persist-credentials: false
      - name: Prepare exact content-bound source changes
        env:
          EXPECTED_PAYLOAD_SHA256: 9db299c7bd568cd67b39ccd3c6bafa49ddd4ec9da471803bfea3662dd2a5860e
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          raw = base64.b64decode('', validate=True)
          assert hashlib.sha256(raw).hexdigest() == os.environ['EXPECTED_PAYLOAD_SHA256'], 'payload mismatch'
          p = json.loads(raw)
          assert p['repository'] == os.environ['GITHUB_REPOSITORY'] == 'dlworrell/AEMS'
          assert os.environ['GITHUB_ACTOR'] == 'dlworrell'
          assert os.environ.get('GITHUB_TRIGGERING_ACTOR', 'dlworrell') == 'dlworrell'
          assert os.environ['GITHUB_REF_NAME'] == 'bootstrap/aems-fitment-retention-20261026'
          assert p['base_branch'] == 'dev-daily' and p['branch'] == 'fix/fitment-branch-retention-20261026'
          root = pathlib.Path('work').resolve()
          assert subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip() == p['base_sha']
          assert len(p['paths']) == len(set(p['paths'])) == len(p['files'])
          assert [item['path'] for item in p['files']] == p['paths']
          for item in p['files']:
              path = pathlib.PurePosixPath(item['path'])
              assert not path.is_absolute() and all(part not in ('..','.git') for part in path.parts)
              assert not str(path).startswith('.github/workflows/')
              data = base64.b64decode(item['base64'], validate=True)
              blob = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert blob == item['blob_sha'], item['path']
              target = root / path
              assert target.resolve().is_relative_to(root)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
          subprocess.run(['git','-C',str(root),'add','--',*p['paths']],check=True)
          assert subprocess.check_output(['git','-C',str(root),'write-tree'],text=True).strip() == p['tree_sha'], 'staged tree mismatch'
          pathlib.Path('reviewed-payload.json').write_bytes(raw)
          print('Prepared exact reviewed tree:', p['tree_sha'])
          PY
      - name: Run focused regression tests
        working-directory: work
        run: python3 -m unittest tests.test_check_integration_branches tests.test_fitment_cycle tests.test_catylist_rulesets tests.test_cleanup_merged_branches -q
      - name: Publish and independently verify the feature commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, pathlib, sys
          spec = importlib.util.spec_from_file_location('publisher', 'publisher/tools/project_zero_commit.py')
          publisher = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = publisher
          spec.loader.exec_module(publisher)
          p = json.loads(pathlib.Path('reviewed-payload.json').read_text())
          assert publisher.main(['--repository', p['repository'], '--branch', p['branch'], '--base', p['base_branch'], '--root', 'work', '--message', p['message'], *p['paths']]) == 0
          api = publisher.GitHub(os.environ['GITHUB_TOKEN'], 'https://api.github.com', 'https://api.github.com/graphql')
          head = api.ref_sha(p['repository'], p['branch'])
          status, commit = api.rest('GET', f"/repos/{p['repository']}/commits/{head}")
          assert status == 200 and commit['sha'] == head
          assert commit['commit']['tree']['sha'] == p['tree_sha']
          assert [parent['sha'] for parent in commit['parents']] == [p['base_sha']]
          assert commit['commit']['verification']['verified'] is True
          assert commit['commit']['verification']['reason'] == 'valid'
          assert api.ref_sha(p['repository'],p['branch']) == head
          result = {'repository':p['repository'],'head':head,'base':p['base_sha'],'tree':p['tree_sha'],'verified':True,'reason':'valid'}
          print('VERIFIED_REPAIR_RESULT='+json.dumps(result,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## Verified feature publication\n\n```json\n'+json.dumps(result,indent=2)+'\n```\n')
          PY
